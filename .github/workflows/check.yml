name: Evaluation checks
on: [push, pull_request]
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests
      - run: >-
          python scripts/evaluate_tests.py --project examples/java-tests
          --signature 'public static int clamp(int value)'
          --test-class benchmark.SubjectTest --out-dir evaluation-output/example
      - run: >-
          mvn org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get
          -Dartifact=org.jacoco:org.jacoco.agent:0.8.14:jar:runtime
      - run: >-
          python scripts/evaluate_tests.py --project examples/java-tests
          --signature 'public static int clamp(int value)'
          --test-class benchmark.SubjectTest --mutation
          --out-dir evaluation-output/example-mutation

<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="500" viewBox="0 0 1660 500" role="img" aria-labelledby="title description">
  <title id="title">Behavioral blind-spot evaluation framework</title>
  <desc id="description">Source code leads to generated tests and compilation, execution, and failure analysis. Passing tests undergo extreme-condition mutation and assertion mutation. Analysis scripts combine execution, test, and mutation evidence to report Boundary-Value Adequacy, Control-Flow Adequacy, and Oracle Strength.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9 Z" fill="#287a88"/></marker>
    <marker id="evidence-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 8 5 L 1 9 Z" fill="#91a4b0"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .heading { fill: #433953; font-size: 23px; font-weight: 700; text-anchor: middle; }
      .caption { fill: #687482; font-size: 18px; text-anchor: middle; }
      .circle { fill: #fff; stroke: #655674; stroke-width: 2.6; }
      .icon { fill: none; stroke: #655674; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .accent { stroke: #287a88; }
      .flow { fill: none; stroke: #287a88; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="500" fill="#fff"/>
  <text x="58" y="45" fill="#687482" font-size="15" font-weight="700">BEHAVIORAL BLIND-SPOT EVALUATION</text>
  <path d="M 58 64 H 1602" stroke="#e7ebee" stroke-width="1.5"/>

  <!-- Main flow and parallel mutation evidence. -->
  <path class="flow" d="M 201 235 H 300"/>
  <path class="flow" d="M 431 235 H 529"/>
  <path class="flow" d="M 661 235 H 706 V 185 H 797"/>
  <path class="flow" d="M 706 235 V 365 H 797"/>
  <circle cx="706" cy="235" r="4" fill="#287a88"/>
  <path class="flow" d="M 925 185 H 983 V 235 H 1048"/>
  <path class="flow" d="M 925 365 H 983 V 235" style="marker-end: none"/>
  <circle cx="983" cy="235" r="4" fill="#287a88"/>
  <path class="flow" d="M 1180 235 H 1232 V 125 H 1308"/>
  <path class="flow" d="M 1232 235 H 1308"/>
  <path class="flow" d="M 1232 235 V 345 H 1308"/>
  <circle cx="1232" cy="235" r="4" fill="#287a88"/>
  <path d="M 596 303 V 438 H 1114 V 305" fill="none" stroke="#91a4b0" stroke-width="2" stroke-dasharray="6 6" stroke-linejoin="round" marker-end="url(#evidence-arrow)"/>

  <!-- Source code. -->
  <text class="heading" x="136" y="137">Source code</text>
  <circle class="circle" cx="136" cy="235" r="63"/>
  <g class="icon">
    <path d="M 112 202 H 143 L 159 218 V 267 H 112 Z"/>
    <path d="M 143 202 V 218 H 159"/>
    <path class="accent" d="M 126 230 L 120 236 L 126 242 M 145 230 L 151 236 L 145 242 M 139 227 L 132 245"/>
    <path d="M 121 255 H 149" stroke="#a9a0b2"/>
  </g>
  <text class="caption" x="136" y="330">Target Java method</text>

  <!-- Test generation. -->
  <text class="heading" x="366" y="137">Generated tests</text>
  <circle class="circle" cx="366" cy="235" r="63"/>
  <g class="icon">
    <rect x="340" y="203" width="53" height="64" rx="4"/>
    <path class="accent" d="M 349 219 L 352 222 L 359 215 M 349 235 L 352 238 L 359 231 M 349 251 L 352 254 L 359 247"/>
    <path d="M 369 219 H 384 M 369 235 H 384 M 369 251 H 384"/>
    <path d="M 348 196 H 381" stroke="#a9a0b2"/>
  </g>
  <text class="caption" x="366" y="330">LLM-generated suites</text>

  <!-- Failure analysis. -->
  <text class="heading" x="596" y="137">Failure analysis</text>
  <circle class="circle" cx="596" cy="235" r="63"/>
  <g class="icon">
    <path d="M 568 207 H 624 L 604 233 V 252 L 588 260 V 233 Z"/>
    <path d="M 581 215 H 611" stroke="#a9a0b2"/>
    <circle cx="619" cy="256" r="12" fill="#fff" class="accent"/>
    <path class="accent" d="M 613 256 L 617 260 L 625 251"/>
  </g>
  <rect x="493" y="309" width="206" height="30" fill="#fff"/>
  <text class="caption" x="596" y="330">Compile and execute</text>
  <text x="677" y="215" fill="#287a88" font-size="16" text-anchor="middle">Pass</text>

  <!-- Extreme-condition mutation. -->
  <text class="heading" x="861" y="87">Control-flow</text>
  <text class="heading" x="861" y="113">extreme mutation</text>
  <circle class="circle" cx="861" cy="185" r="60"/>
  <g class="icon" transform="translate(0,30)">
    <path d="M 861 122 L 879 140 L 861 158 L 843 140 Z"/>
    <path d="M 843 140 H 832 V 178 H 845 M 879 140 H 890 V 178 H 877"/>
    <path class="accent" d="M 843 173 L 848 178 L 843 183 M 879 173 L 874 178 L 879 183"/>
    <path d="M 856 136 L 860 141 L 866 134"/>
  </g>

  <!-- Assertion mutation. -->
  <text class="heading" x="861" y="277">Assertion mutation</text>
  <circle class="circle" cx="861" cy="365" r="60"/>
  <g class="icon" transform="translate(0,25)">
    <rect x="834" y="313" width="43" height="49" rx="4"/>
    <path d="M 844 324 H 865 M 844 334 H 857" stroke="#a9a0b2"/>
    <circle class="accent" cx="872" cy="350" r="13" fill="#fff"/>
    <path class="accent" d="M 882 360 L 892 370 M 866 350 L 870 354 L 878 346"/>
  </g>

  <!-- Analysis. -->
  <text class="heading" x="1114" y="137">Analysis scripts</text>
  <circle class="circle" cx="1114" cy="235" r="63"/>
  <g class="icon">
    <rect x="1085" y="208" width="58" height="52" rx="4"/>
    <path d="M 1085 220 H 1143"/>
    <circle cx="1093" cy="214" r="1.3" fill="#655674" stroke="none"/>
    <circle cx="1099" cy="214" r="1.3" fill="#655674" stroke="none"/>
    <path class="accent" d="M 1095 232 L 1102 238 L 1095 244 M 1109 246 H 1117"/>
    <path d="M 1125 243 V 250 M 1132 233 V 250"/>
  </g>
  <rect x="1006" y="309" width="216" height="30" fill="#fff"/>
  <text class="caption" x="1114" y="330">Combine the evidence</text>

  <!-- Three public adequacy scores. -->
  <circle cx="1349" cy="125" r="38" fill="#edf7f5" stroke="#287f77" stroke-width="2.5"/>
  <text x="1349" y="133" fill="#216b64" font-size="23" font-weight="700" text-anchor="middle">BVA</text>
  <text x="1410" y="120" fill="#433953" font-size="19" font-weight="700">Boundary-value</text>
  <text x="1410" y="145" fill="#687482" font-size="18">adequacy</text>
  <circle cx="1349" cy="235" r="38" fill="#eef4fb" stroke="#487aa9" stroke-width="2.5"/>
  <text x="1349" y="243" fill="#38648d" font-size="23" font-weight="700" text-anchor="middle">CFA</text>
  <text x="1410" y="230" fill="#433953" font-size="19" font-weight="700">Control-flow</text>
  <text x="1410" y="255" fill="#687482" font-size="18">adequacy</text>
  <circle cx="1349" cy="345" r="38" fill="#f6f0f6" stroke="#87628b" stroke-width="2.5"/>
  <text x="1349" y="353" fill="#755278" font-size="23" font-weight="700" text-anchor="middle">OS</text>
  <text x="1410" y="340" fill="#433953" font-size="19" font-weight="700">Oracle</text>
  <text x="1410" y="365" fill="#687482" font-size="18">strength</text>

  <!-- BVA also uses execution and test evidence without mutation collection. -->
  <rect x="711" y="425" width="290" height="27" fill="#fff"/>
  <text class="caption" x="856" y="444">Execution and test evidence</text>
</svg>
